name: Keep Render Services Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Flask ML microservice
        continue-on-error: true
        run: |
          curl -sS -X POST "https://secureshield-backend-suxu.onrender.com/predict" \
            -H "Content-Type: application/json" \
            -d '{"url": "http://example.com"}' \
            --max-time 60 \
            -o /dev/null -w "Flask service responded: %{http_code}\n"

      - name: Ping Spring Boot backend
        continue-on-error: true
        run: |
          curl -sS "https://secureshield-backend-1.onrender.com" \
            --max-time 100 \
            -o /dev/null -w "Spring Boot service responded: %{http_code}\n" || true
          echo "Retrying to confirm it's awake..."
          curl -sS "https://secureshield-backend-1.onrender.com" \
            --max-time 30 \
            -o /dev/null -w "Spring Boot service (retry) responded: %{http_code}\n"